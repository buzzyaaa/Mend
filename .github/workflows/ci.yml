name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  core-test:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Run core tests
        run: cargo test --manifest-path src-tauri/core/Cargo.toml

  frontend-check:
    name: Frontend Type & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  # 说明：真实的可安装包（Windows NSIS）只能在 Windows 上构建，由 .github/workflows/release.yml
  # 在打 `v*` tag 时构建并发布到 GitHub Release（含 latest.json 与签名）。这里不跑 Tauri 打包，
  # 避免在非 Windows 环境因 NSIS 不可用而失败。
