name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-test:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run core tests
        run: cargo test --manifest-path core/Cargo.toml

  native-check:
    name: Native module check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the nsh native module
        run: cargo check --manifest-path native/Cargo.toml

  app-check:
    name: App type check and headless test
    runs-on: ubuntu-latest
    env:
      MEND_DATA_DIR: ${{ github.workspace }}/.tmp/mend-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - name: Add NSH to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: nsh check .
      - name: Headless UI test
        run: nsh test .
