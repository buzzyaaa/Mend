name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 必须与 release.yml / 本地开发 / .nsh/types  locks 在同一外壳版本。
# install.sh 读 NSH_VERSION；不锁会装到最新版（实测 0.7.1），
# 与本机生成的 .nsh 类型/原生模块不兼容，nsh check 直接报
# "these dependencies are built for another nsh"。
env:
  NSH_VERSION: v0.5.1

jobs:
  core-test:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run core tests
        run: cargo test --manifest-path core/Cargo.toml

  native-check:
    name: Native module check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the nsh native module
        run: cargo check --manifest-path native/Cargo.toml

  app-check:
    name: App type check and headless test
    runs-on: ubuntu-latest
    env:
      MEND_DATA_DIR: ${{ github.workspace }}/.tmp/mend-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - name: Add NSH to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: nsh check .
      - name: Headless UI test
        run: nsh test .
