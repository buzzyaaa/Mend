name: Release

# 自动发布：推送 `v*` tag（如 v0.3.0）或手动触发，即在 Windows 上构建 NSIS 安装包并发布到 GitHub Release。
# 发布内容包含安装包、`.sig` 签名，以及 updater 用的 `latest.json`（自动更新功能据此判断新版本）。
#
# 前置条件（仅需配置一次）：
#   仓库 Settings → Secrets and variables → Actions 中添加：
#     - TAURI_SIGNING_PRIVATE_KEY：更新签名私钥（见 local/mend-updater.key，切勿提交）
#   公钥已写入 src-tauri/tauri.conf.json 的 plugins.updater.pubkey，无需改动。
#
# 发布版本号需与三处保持一致：src-tauri/tauri.conf.json、src-tauri/Cargo.toml、package.json。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mend ${{ github.ref_name }}'
          releaseBody: 'Download and install the NSIS setup below. See CHANGELOG in the repo for details.'
          # 直接发布（非草稿）才能被 updater 的 /releases/latest/download/latest.json 访问到。
          # 若想先人工复核，可改为 true（草稿），复核后再在 GitHub 上发布。
          releaseDraft: false
          prerelease: false
