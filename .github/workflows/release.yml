name: Release

# 打 `v*` tag 时自动构建桌面端、生成签名 OTA 包与更新清单，并发布到 GitHub Release，
# 同时把产物镜像到 CNB Release（smybxg/Mend，国内下载加速；更新源仍是 GitHub）。
# 应用更新（整包替换）与 OTA（TSX 签名包）共用一份 latest.json。
# workflow_dispatch 只用于验证流水线（不发 Release），正式发版请推 `v*` tag。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.4.0); empty = read from nsh.json'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_VERSION: ${{ inputs.version || github.ref_name }}
  BUILD: ${{ github.run_number }}
  # 锁定与本地开发、.nsh/types、docs 一致的外壳版本（当前 v0.7.1）。
  # install.ps1/install.sh 都读 NSH_VERSION。0.7.0 打包版曾有 Tray.set 失效
  # （托盘图标从未被 Shell_NotifyIconW 添加，dev 模式正常）；升外壳版本时
  # 必须在打包产物上回归托盘出现、关闭按钮与托盘菜单召回。
  NSH_VERSION: v0.7.1

jobs:
  package:
    name: Package ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runs_on: windows-latest
          - target: linux
            runs_on: ubuntu-latest
          - target: macos
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Windows 安装必须用 pwsh 直接执行：若写在 bash 的 -Command 双引号里，
      # Git Bash 会先把 $env:GITHUB_PATH 展开成 :GITHUB_PATH，PowerShell 会把它
      # 当成备用数据流而报 "Could not open the alternate data stream"。
      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          $nshBin = Join-Path $env:LOCALAPPDATA 'nsh\bin'
          if (-not (Test-Path (Join-Path $nshBin 'nsh.exe'))) {
            throw "nsh.exe not found under $nshBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nshBin
          Write-Host "nsh bin: $nshBin"

      # nsh package 会生成 Inno Setup 脚本并「在检测到 ISCC.exe 时」编译出
      # Mend-setup.exe（当前用户级安装器，双击可原地覆盖升级）。runner 镜像
      # 通常预装 Inno Setup 6，这里兜底探测并用 choco 安装。nsh 生成的脚本
      # 固定为英文且文件名不带版本，后面会打补丁再编译一次。
      - name: Ensure Inno Setup 6 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6",
              "$env:ProgramFiles\Inno Setup 6",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6"
            )
            $dir = $candidates | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
            if (-not $dir) {
              choco install innosetup -y --no-progress
              $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
            }
            if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) {
              throw "Inno Setup 6 (ISCC.exe) not available"
            }
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          (Get-Command ISCC.exe).Source

      - name: Install NSH (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev clang \
            libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Add macOS Rust targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Package app
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          # workflow_dispatch 未填版本时 github.ref_name 是分支名（如 main），
          # 不能当版本号传给 nsh package，否则 nsh.json 的 updater 解析 semver 会失败。
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' nsh.json | head -1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Cannot resolve a semver version (got '$VERSION')"
            exit 1
          fi
          echo "Packaging $VERSION (build $BUILD)"
          echo "APP_SEMVER=$VERSION" >> "$GITHUB_ENV"
          nsh package . --target ${{ matrix.target }} \
            --app-version "$VERSION" --build "$BUILD" -o dist

      - name: Upload ${{ matrix.target }} update archive
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}-*
          if-no-files-found: error

      # CNB 变体：包名前缀 Mend-cnb（nsh 把 `--name Mend.cnb` 归一化成 Mend-cnb，
      # 平台标识仍在末尾，update-manifest 能正确识别）。关键差异是 nsh.json 的
      # updater 从 github 改成 url，nsh package 会把它固化进 bundle 的
      # nsh-updater.json —— 装了 CNB 版的用户因此从 CNB 的专用清单取更新与 OTA。
      # 输出到独立目录 dist-cnb，避免与原版归档混淆；打包后恢复 nsh.json。
      - name: Package CNB variant
        shell: bash
        run: |
          VERSION="$APP_SEMVER"
          if [ -z "$VERSION" ]; then
            echo "::error::APP_SEMVER is not set"
            exit 1
          fi
          cp nsh.json nsh.json.cnb-backup
          restore() { mv -f nsh.json.cnb-backup nsh.json; }
          trap restore EXIT
          # nsh 的 .sig 文件名写死为「清单同目录/latest.json.sig」，与清单名无关：
          # 清单必须叫 latest.json 签名才配套；latest-cnb.json 只是旧版兼容副本。
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("nsh.json", "utf8"));
            c.updater = {
              url: "https://cnb.cool/smybxg/Mend/-/releases/latest/download/latest.json",
              publicKey: c.updater.publicKey,
              packages: c.updater.packages,
            };
            fs.writeFileSync("nsh.json", JSON.stringify(c, null, 2) + "\n");
          '
          # 不能用 --name Mend.cnb：nsh 会把这个名字同时用于归档前缀和包内
          # 可执行文件（Mend.cnb/Mend.cnb.exe），而运行中的 app 仍按 Mend.exe
          # 校验新包，更新安装报 "the archive has no Mend.exe"。这里保持包内
          # 名称与运行 app 完全一致，仅靠下面改文件名前缀区分两种更新源。
          nsh package . --target ${{ matrix.target }} \
            --app-version "$VERSION" --build "$BUILD" -o dist-cnb
          restore
          trap - EXIT
          # 文件名前缀仍叫 Mend-cnb，供 update-manifest 与下载页区分；包内是
          # 原样的 Mend 应用（Windows 为 Mend/Mend.exe）。
          for f in dist-cnb/Mend-*.zip dist-cnb/Mend-*.tar.gz; do
            [ -f "$f" ] || continue
            mv "$f" "dist-cnb/Mend-cnb-${f#dist-cnb/Mend-}"
          done
          # 核对 CNB 源确实固化进包（在 CNB 包的 nsh-updater.json 里）。
          grep -rq "cnb.cool" dist-cnb || {
            echo "::error::CNB updater not baked into package"
            exit 1
          }
          # 断言包内可执行文件没被改名，避免再次发出装不上的更新包。
          # Windows 的 unzip 可能输出 `Mend\Mend.exe`，正/反斜杠都接受；
          # 同时显式排除被 --name 改坏后的 `Mend.cnb.exe`。
          case '${{ matrix.target }}' in
            windows)
              echo "::group::CNB windows archive entries"
              # 不用 head：提前关闭管道会让 unzip 收到 SIGPIPE，
              # 在 set -o pipefail 下整个步骤以 141 失败。
              unzip -Z1 dist-cnb/Mend-cnb-*.zip | sed -n '1,10p'
              echo "::endgroup::"
              unzip -Z1 dist-cnb/Mend-cnb-*.zip | tr -d '\r' | grep -q 'Mend\.exe' || {
                echo "::error::CNB windows archive has no Mend.exe"; exit 1;
              }
              if unzip -Z1 dist-cnb/Mend-cnb-*.zip | grep -qi 'Mend\.cnb\.exe'; then
                echo "::error::CNB windows archive has renamed Mend.cnb.exe"; exit 1
              fi
              ;;
            *)
              if tar -tzf dist-cnb/Mend-cnb-*.tar.gz | grep -q 'Mend\.cnb'; then
                echo "::error::CNB archive contains renamed Mend.cnb executable"
                exit 1
              fi
              ;;
          esac

      - name: Upload ${{ matrix.target }} CNB update archive
        uses: actions/upload-artifact@v4
        with:
          name: app-cnb-${{ matrix.target }}
          path: dist-cnb/*-${{ matrix.target }}-*
          if-no-files-found: error

      # 安装器是额外的下载选项，不参与应用内自动更新（latest.json 的 windows
      # 平台资产仍指向 zip，updater 只接受 zip/tar.gz）。单独上传为 artifact。
      # nsh 生成的 .iss 固定英文名且不写版本：先打补丁（版本号 + 中英文语言页），
      # 再用 ISCC 重编译。原版与 CNB 版各编译一份：CNB 安装器内的 bundle 来自
      # dist-cnb（updater 已指向 CNB），文件名 Mend-cnb-<version>-setup.exe。
      - name: Build localized Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:APP_SEMVER
          if (-not $version) { throw 'APP_SEMVER is not set' }
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          function Build-Installer($issFile, $outDir, $variant) {
            if (-not $issFile) { throw 'nsh package did not produce the installer script' }
            if ($variant -eq 'cnb') {
              node scripts/patch-installer.mjs "$($issFile.FullName)" "$version" cnb
            } else {
              node scripts/patch-installer.mjs "$($issFile.FullName)" "$version"
            }
            & $iscc /Q "/O$((Resolve-Path $outDir).Path)" "$($issFile.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
            $prefix = if ($variant -eq 'cnb') { 'Mend-cnb' } else { 'Mend' }
            $setupName = "$prefix-$version-setup.exe"
            $setup = Join-Path (Resolve-Path $outDir).Path $setupName
            if (-not (Test-Path $setup)) { throw "ISCC did not produce $setupName" }
            Get-Item $setup | Select-Object FullName, Length
          }
          $ghIss = Get-ChildItem -Path dist -Filter 'Mend.iss' -Recurse | Select-Object -First 1
          Build-Installer $ghIss 'dist' ''
          # 丢掉 nsh 先编译的无版本/纯英文版本，避免误下载。
          Get-ChildItem -Path dist -Filter 'Mend-setup.exe' -Recurse | Remove-Item -Force
          $cnbIss = Get-ChildItem -Path dist-cnb -Filter 'Mend.iss' -Recurse | Select-Object -First 1
          Build-Installer $cnbIss 'dist-cnb' 'cnb'
          Get-ChildItem -Path dist-cnb -Filter 'Mend-setup.exe' -Recurse | Remove-Item -Force
          # 两个 variant 的 .iss 都叫 Mend.iss；改个名字再上传，避免后续
          # download-artifact merge-multiple 时同名文件互相覆盖。
          Copy-Item $cnbIss.FullName (Join-Path (Split-Path $cnbIss.FullName) 'Mend-cnb.iss') -Force

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Mend-*-setup.exe
            dist/Mend.iss
          if-no-files-found: error

      - name: Upload CNB Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-cnb
          path: |
            dist-cnb/Mend-cnb-*-setup.exe
            dist-cnb/Mend-cnb.iss
          if-no-files-found: error

  ot-package:
    name: Build signed OTA package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSH
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          $nshBin = Join-Path $env:LOCALAPPDATA 'nsh\bin'
          if (-not (Test-Path (Join-Path $nshBin 'nsh.exe'))) {
            throw "nsh.exe not found under $nshBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nshBin

      - name: Write release signing secret
        shell: bash
        env:
          NSH_RELEASE_KEY: ${{ secrets.NSH_RELEASE_KEY }}
        run: |
          if [ -z "$NSH_RELEASE_KEY" ]; then
            echo "::error::NSH_RELEASE_KEY secret is missing"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$NSH_RELEASE_KEY" > keys/release.secret

      - name: Publish signed package
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' nsh.json | head -1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Cannot resolve a semver version (got '$VERSION')"
            exit 1
          fi
          mkdir -p dist
          nsh publish . \
            --key keys/release.secret \
            --cert keys/release.cert \
            --app-version "$VERSION" --build "$BUILD" \
            --source-map file \
            -o "dist/com.mend.app-${BUILD}.nshpkg"

      - name: Upload OTA package
        uses: actions/upload-artifact@v4
        with:
          name: ot-package
          path: dist/*.nshpkg
          if-no-files-found: error

  manifest:
    name: Manifest and publish release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, ot-package]

    steps:
      - uses: actions/checkout@v4

      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Write update signing secret
        shell: bash
        env:
          NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
        run: |
          if [ -z "$NSH_UPDATE_KEY" ]; then
            echo "::error::NSH_UPDATE_KEY secret is missing"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$NSH_UPDATE_KEY" > keys/update.secret

      - name: Generate signed manifests
        shell: bash
        run: |
          shopt -s nullglob
          # 原版归档名是 Mend-<version>-<os>-<arch>，CNB 版是 Mend-cnb-<version>-*。
          # 用版本号位（[0-9]*）区分，避免 CNB 包混进原版清单。
          gh_archives=(dist/Mend-[0-9]*.tar.gz dist/Mend-[0-9]*.zip)
          cnb_archives=(dist/Mend-cnb-*.tar.gz dist/Mend-cnb-*.zip)
          packages=(dist/*.nshpkg)
          if [ ${#gh_archives[@]} -eq 0 ] || [ ${#cnb_archives[@]} -eq 0 ]; then
            echo "::error::Missing platform archives (gh=${#gh_archives[@]}, cnb=${#cnb_archives[@]})"
            exit 1
          fi
          if [ ${#packages[@]} -ne 1 ]; then
            echo "::error::Expected exactly one OTA package, found ${#packages[@]}"
            exit 1
          fi
          # 原版清单：URL 相对清单存放位置（GitHub updater 从该 release 取包）。
          nsh update-manifest "${gh_archives[@]}" \
            --package "${packages[0]}" \
            --notes CHANGELOG.md \
            --key keys/update.secret \
            -o dist
          # CNB 清单：--base-url 把所有平台包和 OTA 包地址改写成 CNB Release 直链；
          # 装了 CNB 版的用户全流程不出 CNB。
          # 关键：nsh 运行时把 .sig 地址写死为「清单所在目录/latest.json.sig」，
          # 与清单文件名无关。所以 CNB Release 上的清单必须叫 latest.json，
          # 签名才配套。原版 latest.json 只发 GitHub Release，不同步到 CNB，
          # 两者各在一个 host 的同名路径，互不干扰。
          # 生成到独立目录，再复制成多份（签名只认内容，不认文件名）：
          #   dist/cnb/latest.json(.sig)      → CNB Release 的 latest.json(.sig)，新版 app 读
          #   dist/latest-cnb.json(.sig)      → 旧版 0.6.9 CNB app 固化地址 + GitHub 存档
          mkdir -p dist-cnb-manifest
          nsh update-manifest "${cnb_archives[@]}" \
            --package "${packages[0]}" \
            --notes CHANGELOG.md \
            --key keys/update.secret \
            --base-url "https://cnb.cool/smybxg/Mend/-/releases/latest/download" \
            -o dist-cnb-manifest
          # 密钥与 publicKey 不匹配时 nsh 会退出 0 却只写 json 不写 .sig，
          # 这里显式断言四份文件齐全，避免带着坏清单发版。
          for f in dist/latest.json dist/latest.json.sig \
                   dist-cnb-manifest/latest.json dist-cnb-manifest/latest.json.sig; do
            [ -s "$f" ] || { echo "::error::missing manifest file: $f"; exit 1; }
          done
          mkdir -p dist/cnb
          cp dist-cnb-manifest/latest.json dist/cnb/latest.json
          cp dist-cnb-manifest/latest.json.sig dist/cnb/latest.json.sig
          cp dist-cnb-manifest/latest.json dist/latest-cnb.json
          cp dist-cnb-manifest/latest.json.sig dist/latest-cnb.json.sig
          # 两份 CNB 清单必须字节一致：旧版 app 读 latest-cnb.json 的内容，
          # 却读同目录固定名 latest.json.sig 的签名，内容不同就会验签失败。
          cmp -s dist/cnb/latest.json dist/latest-cnb.json || {
            echo "::error::CNB manifest copies differ"; exit 1;
          }
          node -e '
            const fs = require("fs");
            const gh = JSON.parse(fs.readFileSync("dist/latest.json", "utf8"));
            const cnb = JSON.parse(fs.readFileSync("dist/latest-cnb.json", "utf8"));
            // 原版清单里平台包是相对名 Mend-<ver>-<os>-<arch>.{zip,tar.gz}，
            // OTA 包是相对名 com.mend.app-<build>.nshpkg；CNB 清单两种都是
            // https://cnb.cool/... 绝对直链。两种形态都合法。
            const isRelativeName = (u) => /^Mend/.test(u) || /^com\.mend\.app-.*\.nshpkg$/.test(u);
            for (const [name, m] of [["latest.json", gh], ["latest-cnb.json", cnb]]) {
              const urls = [...Object.values(m.platforms).map((p) => p.url), m.package.url];
              if (urls.some((u) => !u || (!u.startsWith("http") && !isRelativeName(u)))) {
                throw new Error(`${name}: bad url in manifest: ${JSON.stringify(urls)}`);
              }
            }
            const cnbUrls = [...Object.values(cnb.platforms).map((p) => p.url), cnb.package.url];
            if (!cnbUrls.every((u) => u.startsWith("https://cnb.cool/smybxg/Mend/-/releases/"))) {
              throw new Error("CNB manifest contains non-CNB download urls");
            }
            console.log("manifests ok: github", Object.keys(gh.platforms).join(","), "| cnb", Object.keys(cnb.platforms).join(","));
          '

      # cnb-sync 只下载 workflow artifacts；manifest 不上传的话镜像会缺清单。
      - name: Upload update manifests
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: |
            dist/latest.json
            dist/latest.json.sig
            dist/latest-cnb.json
            dist/latest-cnb.json.sig
            dist/cnb/latest.json
            dist/cnb/latest.json.sig
          if-no-files-found: error

      # 只在 tag 推送时发 Release；手动触发不会把产物挂到分支名上。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mend ${{ github.ref_name }}
          body: |
            Mend ${{ github.ref_name }} — Native Shell build.

            Windows: download Mend-<version>-setup.exe for a per-user installer
            (first step picks English / 简体中文; double-click to install or
            upgrade in place), or the zip for a portable copy.
            Linux / macOS: download the platform archive.
            Existing vaults in the application data directory open as-is.

            Packages prefixed Mend-cnb- use CNB as their update source
            (including OTA); all other packages use GitHub.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/Mend-*-setup.exe
            dist/*.nshpkg
            dist/latest.json
            dist/latest.json.sig
            dist/latest-cnb.json
            dist/latest-cnb.json.sig

  # 把同一份产物镜像到 CNB Release，供国内下载。更新源仍是 GitHub（nsh updater 单源）。
  cnb-sync:
    name: Sync release to CNB
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [manifest]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Sync to CNB release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::CNB_TOKEN secret is missing"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # 原版与 CNB 版产物都同步到 CNB Release（国内下载加速）。
          # 更新清单只放 CNB 版那一份：nsh 把 .sig 地址写死为清单同目录的
          # latest.json.sig，所以 CNB Release 上的 latest.json(.sig) 必须是
          # CNB 清单（平台包与 OTA 都是 CNB 直链），新版 CNB app 才能验签。
          # 原版清单不同步到 CNB——原版 app 从 GitHub 取，CNB 上的原版包
          # 只是下载加速，更新仍走 GitHub。
          # dist/cnb/latest.json 上传后 basename 即 latest.json，与签名配套。
          # dist/latest-cnb.* 保留为旧版 0.6.9 CNB app 的固化地址（内容相同）。
          node scripts/sync-cnb-release.mjs smybxg/Mend "${{ github.ref_name }}" \
            dist/*.zip dist/*.tar.gz \
            "dist/Mend-$VERSION-setup.exe" "dist/Mend-cnb-$VERSION-setup.exe" \
            dist/*.nshpkg \
            dist/cnb/latest.json dist/cnb/latest.json.sig \
            dist/latest-cnb.json dist/latest-cnb.json.sig
