name: Release

# 打 `v*` tag 时自动构建桌面端、生成签名 OTA 包与更新清单，并发布到 GitHub Release，
# 同时把产物镜像到 CNB Release（smybxg/Mend，国内下载加速；更新源仍是 GitHub）。
# 应用更新（整包替换）与 OTA（TSX 签名包）共用一份 latest.json。
# workflow_dispatch 只用于验证流水线（不发 Release），正式发版请推 `v*` tag。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.4.0); empty = read from nsh.json'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_VERSION: ${{ inputs.version || github.ref_name }}
  BUILD: ${{ github.run_number }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runs_on: windows-latest
          - target: linux
            runs_on: ubuntu-latest
          - target: macos
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Windows 安装必须用 pwsh 直接执行：若写在 bash 的 -Command 双引号里，
      # Git Bash 会先把 $env:GITHUB_PATH 展开成 :GITHUB_PATH，PowerShell 会把它
      # 当成备用数据流而报 "Could not open the alternate data stream"。
      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          $nshBin = Join-Path $env:LOCALAPPDATA 'nsh\bin'
          if (-not (Test-Path (Join-Path $nshBin 'nsh.exe'))) {
            throw "nsh.exe not found under $nshBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nshBin
          Write-Host "nsh bin: $nshBin"

      # nsh package 会生成 Inno Setup 脚本并「在检测到 ISCC.exe 时」编译出
      # Mend-setup.exe（当前用户级安装器，双击可原地覆盖升级）。runner 镜像
      # 通常预装 Inno Setup 6，这里兜底探测并用 choco 安装。nsh 生成的脚本
      # 固定为英文且文件名不带版本，后面会打补丁再编译一次。
      - name: Ensure Inno Setup 6 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6",
              "$env:ProgramFiles\Inno Setup 6",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6"
            )
            $dir = $candidates | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
            if (-not $dir) {
              choco install innosetup -y --no-progress
              $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
            }
            if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) {
              throw "Inno Setup 6 (ISCC.exe) not available"
            }
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          (Get-Command ISCC.exe).Source

      - name: Install NSH (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev clang \
            libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Add macOS Rust targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Package app
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          # workflow_dispatch 未填版本时 github.ref_name 是分支名（如 main），
          # 不能当版本号传给 nsh package，否则 nsh.json 的 updater 解析 semver 会失败。
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' nsh.json | head -1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Cannot resolve a semver version (got '$VERSION')"
            exit 1
          fi
          echo "Packaging $VERSION (build $BUILD)"
          echo "APP_SEMVER=$VERSION" >> "$GITHUB_ENV"
          nsh package . --target ${{ matrix.target }} \
            --app-version "$VERSION" --build "$BUILD" -o dist

      - name: Upload ${{ matrix.target }} update archive
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}-*
          if-no-files-found: error

      # 安装器是额外的下载选项，不参与应用内自动更新（latest.json 的 windows
      # 平台资产仍指向 zip，updater 只接受 zip/tar.gz）。单独上传为 artifact。
      # nsh 生成的 .iss 固定英文名且不写版本：先打补丁（版本号 + 中英文语言页），
      # 再用 ISCC 重编译，最终只发布 dist/Mend-<version>-setup.exe。
      - name: Build localized Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:APP_SEMVER
          if (-not $version) { throw 'APP_SEMVER is not set' }
          $iss = Get-ChildItem -Path dist -Filter 'Mend.iss' -Recurse | Select-Object -First 1
          if (-not $iss) { throw 'nsh package did not produce Mend.iss' }
          node scripts/patch-installer.mjs "$($iss.FullName)" "$version"
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc /Q "/O$((Resolve-Path dist).Path)" "$($iss.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setupName = "Mend-$version-setup.exe"
          $setup = Join-Path (Resolve-Path dist).Path $setupName
          if (-not (Test-Path $setup)) { throw "ISCC did not produce $setupName" }
          # 丢掉 nsh 先编译的无版本/纯英文版本，避免误下载。
          Get-ChildItem -Path dist -Filter 'Mend-setup.exe' -Recurse | Remove-Item -Force
          Get-Item $setup | Select-Object FullName, Length

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Mend-*-setup.exe
            dist/Mend.iss
          if-no-files-found: error

  ot-package:
    name: Build signed OTA package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSH
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          $nshBin = Join-Path $env:LOCALAPPDATA 'nsh\bin'
          if (-not (Test-Path (Join-Path $nshBin 'nsh.exe'))) {
            throw "nsh.exe not found under $nshBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nshBin

      - name: Write release signing secret
        shell: bash
        env:
          NSH_RELEASE_KEY: ${{ secrets.NSH_RELEASE_KEY }}
        run: |
          if [ -z "$NSH_RELEASE_KEY" ]; then
            echo "::error::NSH_RELEASE_KEY secret is missing"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$NSH_RELEASE_KEY" > keys/release.secret

      - name: Publish signed package
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' nsh.json | head -1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Cannot resolve a semver version (got '$VERSION')"
            exit 1
          fi
          mkdir -p dist
          nsh publish . \
            --key keys/release.secret \
            --cert keys/release.cert \
            --app-version "$VERSION" --build "$BUILD" \
            --source-map file \
            -o "dist/com.mend.app-${BUILD}.nshpkg"

      - name: Upload OTA package
        uses: actions/upload-artifact@v4
        with:
          name: ot-package
          path: dist/*.nshpkg
          if-no-files-found: error

  manifest:
    name: Manifest and publish release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, ot-package]

    steps:
      - uses: actions/checkout@v4

      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Write update signing secret
        shell: bash
        env:
          NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
        run: |
          if [ -z "$NSH_UPDATE_KEY" ]; then
            echo "::error::NSH_UPDATE_KEY secret is missing"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$NSH_UPDATE_KEY" > keys/update.secret

      - name: Generate signed manifest
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*-*.tar.gz dist/*-*.zip)
          packages=(dist/*.nshpkg)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No platform archives found in dist"
            exit 1
          fi
          if [ ${#packages[@]} -ne 1 ]; then
            echo "::error::Expected exactly one OTA package, found ${#packages[@]}"
            exit 1
          fi
          nsh update-manifest "${archives[@]}" \
            --package "${packages[0]}" \
            --notes CHANGELOG.md \
            --key keys/update.secret \
            -o dist

      # cnb-sync 只下载 workflow artifacts；manifest 不上传的话镜像会缺 latest.json。
      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: |
            dist/latest.json
            dist/latest.json.sig
          if-no-files-found: error

      # 只在 tag 推送时发 Release；手动触发不会把产物挂到分支名上。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mend ${{ github.ref_name }}
          body: |
            Mend ${{ github.ref_name }} — Native Shell build.

            Windows: download Mend-<version>-setup.exe for a per-user installer
            (first step picks English / 简体中文; double-click to install or
            upgrade in place), or the zip for a portable copy.
            Linux / macOS: download the platform archive.
            Existing vaults in the application data directory open as-is.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/Mend-*-setup.exe
            dist/*.nshpkg
            dist/latest.json
            dist/latest.json.sig

  # 把同一份产物镜像到 CNB Release，供国内下载。更新源仍是 GitHub（nsh updater 单源）。
  cnb-sync:
    name: Sync release to CNB
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [manifest]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Sync to CNB release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::CNB_TOKEN secret is missing"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/sync-cnb-release.mjs smybxg/Mend "${{ github.ref_name }}" \
            dist/*.zip dist/*.tar.gz "dist/Mend-$VERSION-setup.exe" dist/*.nshpkg \
            dist/latest.json dist/latest.json.sig
