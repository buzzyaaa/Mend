name: Release

# 打 `v*` tag 时自动构建桌面端、生成签名 OTA 包与更新清单，并发布到 GitHub Release。
# 应用更新（整包替换）与 OTA（TSX 签名包）共用一份 latest.json。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.4.0)'
        required: false
        default: ${{ github.ref_name }}

permissions:
  contents: write

env:
  APP_VERSION: ${{ inputs.version || github.ref_name }}
  BUILD: ${{ github.run_number }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runs_on: windows-latest
          - target: linux
            runs_on: ubuntu-latest
          - target: macos
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install NSH
        shell: bash
        run: |
          if [ "${{ matrix.runs_on }}" = "windows-latest" ]; then
            powershell -NoProfile -Command "irm https://nsh.dev/install.ps1 | iex"
            echo "$env:LOCALAPPDATA/nsh/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://nsh.dev/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev clang \
            libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Add macOS Rust targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Package app
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          nsh package . --target ${{ matrix.target }} \
            --app-version "$VERSION" --build "$BUILD" -o dist

      - name: Upload ${{ matrix.target }} update archive
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}-*
          if-no-files-found: error

  ot-package:
    name: Build signed OTA package
    runs-on: windows-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install NSH
        shell: bash
        run: |
          powershell -NoProfile -Command "irm https://nsh.dev/install.ps1 | iex"
          echo "$env:LOCALAPPDATA/nsh/bin" >> "$GITHUB_PATH"

      - name: Write release signing secret
        shell: bash
        run: mkdir -p keys && printf '%s' "$NSH_RELEASE_KEY" > keys/release.secret

      - name: Publish signed package
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          nsh publish . \
            --key keys/release.secret \
            --cert keys/release.cert \
            --app-version "$VERSION" --build "$BUILD" \
            --source-map file \
            -o "dist/com.mend.app-${BUILD}.nshpkg"

      - name: Upload OTA package
        uses: actions/upload-artifact@v4
        with:
          name: ot-package
          path: dist/*.nshpkg
          if-no-files-found: error

  manifest:
    name: Manifest and publish release
    runs-on: ubuntu-latest
    needs: [package, ot-package]

    steps:
      - uses: actions/checkout@v4

      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Write update signing secret
        shell: bash
        run: mkdir -p keys && printf '%s' "$NSH_UPDATE_KEY" > keys/update.secret

      - name: Generate signed manifest
        shell: bash
        run: |
          nsh update-manifest \
            dist/*-*.tar.gz \
            dist/*-*.zip \
            --package dist/*.nshpkg \
            --notes CHANGELOG.md \
            --key keys/update.secret \
            -o dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mend ${{ github.ref_name }}
          body: |
            Mend ${{ github.ref_name }} — Native Shell build.

            Download the platform archive (Windows zip / Linux tar.gz / macOS tar.gz)
            or the signed OTA package. Existing vaults in the application data
            directory open as-is.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.nshpkg
            dist/latest.json
            dist/latest.json.sig
