[package]
name = "mend-core"
version = "0.4.1"
description = "Mend core: encryption, database and error types (no GUI dependencies)"
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"

# 发布体积优化：剥离符号、按体积优先编译（rusqlite bundled 把整份 SQLite C 源码编进本 crate，
# 此 profile 对其体积影响最明显）。lto 会显著拉长构建时间，但只在 `nsh package` 的 release 阶段发生。
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

