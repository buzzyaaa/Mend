[package]
name = "mend"
version = "0.1.0"
description = "Mend — local offline encrypted password manager"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 加密（纯 Rust，阶段 2 接入）
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# 数据库（阶段 2 启用）：rusqlite bundled 会编译 SQLite C 源码，
# 需要完整 MinGW-w64（gcc + 头文件）；当前 Rust 自带 gcc 仅作链接器、不能编译 C。
# rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
