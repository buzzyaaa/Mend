[package]
name = "mend"
version = "0.3.0"
description = "Mend — local offline encrypted password manager"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 核心逻辑（加密、SQLite 仓储、错误类型），不依赖 GUI，可独立跑 cargo test
mend-core = { path = "core" }

# 命令层自用：salt/DEK 的 base64 编解码、条目 id、会话密钥清零
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

# 原生文件选择对话框（备份导出/恢复）
tauri-plugin-dialog = "2"

# 自动更新：检查 / 下载 / 安装（数据源在 tauri.conf.json 的 plugins.updater.endpoints，当前为 GitHub Releases）
tauri-plugin-updater = "2"
# 安装后重启应用
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
